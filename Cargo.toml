[package]
name = "drission"
version = "0.6.5"
edition = "2024"
rust-version = "1.85"
# 示例按能力分文件夹(examples/<分类>/),每个 [[example]] 显式声明 path;关掉自动发现(子目录无
# main.rs 本就不会被当示例,这里再加一道保险,杜绝把资源/子目录误判为示例)。
autoexamples = false
authors = ["极数本源 (apizero.cn)"]
description = "Rust 里用 CDP 控 Chrome，同一套 API 也可驱动 Lightpanda。Context / 磁盘 Profile / XHR 监听与 mock。同仓库有 drs CLI 和 MCP（本机 Chrome）。"
documentation = "https://docs.rs/drission"
homepage = "https://apizero.cn"
repository = "https://github.com/MageGojo/drission-rs"
readme = "README.md"
license-file = "LICENSE"
keywords = ["browser", "cdp", "automation", "chromium", "mcp"]
categories = ["web-programming", "api-bindings", "computer-vision"]
# 发布到 crates.io 时排除:构建产物 / 内部文档 / 各类运行测试产物(样本/吐环境/自训脚手架),
# 这些已在 .gitignore,这里再显式排除(双保险,确保 `cargo publish` 不打包)。
exclude = [
    "/data",
    "/dist",
    "/docs",
    "/target",
    "/yidun_samples",
    "/yidun-train",
    "/dump-env",
    "/dump-env-fp",
    "/douyin-env",
]

# docs.rs:用全部 feature 构建,确保 ocr / slider / cdp 的 API 在文档站可见
# (默认 docs.rs 只用 default features → 这些 feature-gated 类型会被隐藏)。
# 配合 src/lib.rs 顶部的 `#![cfg_attr(docsrs, feature(doc_auto_cfg))]` 显示 feature 徽标。
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = [".", "crates/drission-cli"]
resolver = "2"

[features]
# 后端选择。默认 = 纯 Chromium/CDP(最精简,不含 Camoufox 代码);Camoufox 全 opt-in。
default = ["cdp"]
# Chromium(Chrome / Edge / Brave / Electron,CDP)后端 —— 默认后端。
cdp = []
# Camoufox / Firefox(Juggler)。opt-in。不开则 browser/launcher/page/web_page/session/pool 都不编译。
camoufox = []
# 本地页面上的缺口距离。默认关。公开示例只覆盖本地页。
slider = []
# 可选图像文字识别。默认关。公开文档和示例不展开。
ocr = ["dep:image", "dep:tract-onnx", "dep:fontdue"]
tract-onnx = ["dep:tract-onnx"]
image = ["dep:image"]
# 纯算运行器:内嵌 QuickJS。默认关。
signer = ["dep:rquickjs"]
fontdue = ["dep:fontdue"]
# 可选 HTTP 客户端。默认关。需 cmake + C 编译器。Session 目前在 camoufox 门下,故 imply camoufox。
impersonate = ["camoufox", "dep:wreq", "dep:wreq-util"]

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
dirs = "6.0.0"
ego-tree = "0.11"
fontdue = { version = "0.9.3", optional = true }
futures-util = "0.3.32"
# HTML → Markdown(供 AI/MCP 读页;`drs snapshot` / `extract` 默认附带 markdown)。
htmd = "0.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
libc = "0.2.186"
os_pipe = { version = "1.2.3", features = ["io_safety"] }
reqwest = { version = "0.13.4", features = ["json", "stream", "socks"] }
# 内嵌 QuickJS,编译期静态编进二进制。
rquickjs = { version = "0.11", optional = true }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
tracing = "0.1.44"
tract-onnx = { version = "0.23.3", optional = true }
# 浏览器 TLS/JA3/JA4 + HTTP2 指纹 HTTP 客户端(`impersonate` feature 用),reqwest 硬分叉 + BoringSSL。
wreq = { version = "5", optional = true }
# wreq 的浏览器模拟档(Chrome/Firefox/Safari/Edge 各版本的 TLS+HTTP2 指纹配方)。
wreq-util = { version = "2", optional = true }
zip = "8.6.0"

[dev-dependencies]
criterion = "0.7.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 仅供示例(examples/sites/luffycity_protocol.rs:纯协议无浏览器逆 polyv v11 DRM)的标准 crypto;
# 纯 Rust(RustCrypto),不进发布库(dev-only)。
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
hex = "0.4"

# ── 示例 feature 门控 ──────────────────────────────────────────────────────────
# 默认后端是纯 CDP;用 Camoufox `Browser`/`Page` 的示例必须声明 `required-features=["camoufox"]`,
# 否则默认 `cargo build --examples` 会因 camoufox 模块未编译而失败。
# 运行各示例(头注释里也都写了对应命令,复制即用):
#   自测本站:          cargo run --example own_site
#   cdp 示例:          cargo run --example cdp_demo
#   Camoufox 系示例:   cargo run --example quickstart --no-default-features --features camoufox
#   本地缺口页:        cargo run --example slider_local --no-default-features --features camoufox,slider
# ⚠️ Camoufox 系务必带 `--no-default-features`:默认 cdp 与 camoufox 并存时统一接口按「cdp 优先」解析,
#    会与 camoufox 示例的类型冲突(编译失败或跑成 cdp 后端)。cdp 系反之(默认即可)。

# ═════════ CDP 后端核心(examples/cdp/)═════════
[[example]]
name = "cdp_demo"
path = "examples/cdp/cdp_demo.rs"

# 本地页填表 + 打开 apizero.cn 公开文档页。
[[example]]
name = "own_site"
path = "examples/cdp/own_site.rs"
required-features = ["cdp"]

# Lightpanda(同一套 CDP API,换引擎)。
[[example]]
name = "lightpanda_demo"
path = "examples/cdp/lightpanda_demo.rs"
required-features = ["cdp"]

[[example]]
name = "cdp_advanced"
path = "examples/cdp/cdp_advanced.rs"
required-features = ["cdp"]

# Chrome 自动下载分发(对标 CloakBrowser 首次运行自动下载)。
[[example]]
name = "cdp_fetch"
path = "examples/cdp/cdp_fetch.rs"
required-features = ["cdp"]

# 多任务下载管理 tab.downloads()(CDP 原生下载事件,真机端到端)。
[[example]]
name = "cdp_download"
path = "examples/cdp/cdp_download.rs"
required-features = ["cdp"]

# 键盘:拟人输入 + 修饰组合键/热键(Ctrl/Cmd+A 等,CDP 原生 modifiers)。
[[example]]
name = "cdp_keyboard"
path = "examples/cdp/cdp_keyboard.rs"
required-features = ["cdp"]

# CDP 高并发池 ChromiumPool(多 worker + 每任务独立 context + 断点续抓)。
[[example]]
name = "cdp_pool"
path = "examples/cdp/cdp_pool.rs"
required-features = ["cdp"]

# CDP「标配补齐」(对标 PW/Puppeteer/DP):set_content/媒体模拟/网络离线/设备/storage/wait/HAR/expose/PDF/MHTML。
[[example]]
name = "cdp_extras"
path = "examples/cdp/cdp_extras.rs"
required-features = ["cdp"]

# 一等公民 Context / ProfileManager / 网络门面(离线自验证)。
[[example]]
name = "cdp_context"
path = "examples/cdp/cdp_context.rs"
required-features = ["cdp"]

# Agent / Locator / wait / capture 离线自验证。
[[example]]
name = "cdp_agent"
path = "examples/cdp/cdp_agent.rs"
required-features = ["cdp"]

# 录制生成代码(codegen)+ 无障碍快照(accessibility):录一遍表单 → 出可运行 Rust;ax_tree/ax_snapshot 语义树。
[[example]]
name = "cdp_recorder"
path = "examples/cdp/cdp_recorder.rs"
required-features = ["cdp"]

# ═════════ 教学(examples/learn/)═════════
# 上手 + 进阶 Rust 知识「活教材」:离线(set_content)分 9 课,边用库边讲 async/所有权/Arc/生命周期/Send。
[[example]]
name = "learn_basics"
path = "examples/learn/learn_basics.rs"
required-features = ["cdp"]

# 调试自己的页面:断点、脚本、在 example.com 上重放自己发出的请求。
# ① 在本地页面上对 fetch 下断点,看调用栈。
[[example]]
name = "re_xhr_break"
path = "examples/reverse/re_xhr_break.rs"
required-features = ["cdp"]

# ② 读当前页面的脚本源码。
[[example]]
name = "re_scripts"
path = "examples/reverse/re_scripts.rs"
required-features = ["cdp"]

# 把监听到的请求再发出去。只应重放你有权访问的接口。
[[example]]
name = "re_replay"
path = "examples/reverse/re_replay.rs"
required-features = ["cdp", "impersonate"]

# 对自己的页面做一次调试探查。默认 example.com。
[[example]]
